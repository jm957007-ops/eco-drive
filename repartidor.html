<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3140">
<meta name="description" content="App para repartidores de Eco Drive.">
<title>Eco Drive Repartidor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest-repartidor.webmanifest">
<link rel="apple-touch-icon" href="/apple-repartidor.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>[hidden]{display:none!important}</style>
<script>
// Instalación como app (Android: botón; iPhone: instrucciones)
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
let evInstalar = null;
const btnInstalar = () => document.getElementById('instalar');
const esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const instalada = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); evInstalar = e; const b = btnInstalar(); if (b) b.hidden = false; });
addEventListener('appinstalled', () => { const b = btnInstalar(); if (b) b.hidden = true; });
addEventListener('DOMContentLoaded', () => {
  const b = btnInstalar();
  if (esIOS && !instalada) b.hidden = false;
  b.onclick = async () => {
    if (evInstalar) { evInstalar.prompt(); await evInstalar.userChoice; evInstalar = null; b.hidden = true; }
    else if (esIOS) alert('Para instalar en iPhone: toca el botón Compartir (el cuadro con flecha hacia arriba) en Safari y elige "Agregar a pantalla de inicio".');
  };
});
</script>
</head>
<body>
<div id="mapa" aria-label="Mapa"></div>
<div class="top">
  <div class="brand">eco drive <small>repartidor</small></div>
  <button class="iconbtn" id="instalar" hidden aria-label="Instalar app" style="margin-left:auto;width:auto;padding:0 14px;border-radius:999px;font-weight:700;font-size:14px">📲 Instalar</button>
  <button class="iconbtn" data-act="hist" aria-label="Historial" style="margin-left:8px">☰</button>
</div>
<section class="sheet" id="sheet" aria-live="polite"><div class="grab"></div><p class="muted">Cargando…</p></section>
<div class="modal" id="modal"><section class="sheet" id="msheet"></section></div>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="/src/repartidor.js"></script>
</body>
</html>
