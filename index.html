<link rel="manifest" id="manifest-link" href="/manifest-cliente.webmanifest"/>
<script>
  (function () {
    var app = new URLSearchParams(location.search).get('app');
    var map = {
      repartidor: '/manifest-repartidor.webmanifest',
      admin: '/manifest-admin.webmanifest',
      punto: '/manifest-punto.webmanifest'
    };
    if (map[app]) document.getElementById('manifest-link').href = map[app];
  })();
</script>
